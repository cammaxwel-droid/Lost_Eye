name: Sign release binary

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build native player
        shell: pwsh
        run: .\scripts\Build-Native.ps1 -OutputName 'Lost-Eye-0.3.4-win-x64-gh'

      - name: Upload unsigned EXE
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Lost Eye.exe
          path: artifacts/Lost-Eye-0.3.4-win-x64-gh/Lost Eye.exe
          archive: false

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      - name: Verify signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'signed/Lost Eye.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Signature is not valid: $($signature.Status)"
          }
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          Write-Host "Timestamp: $($signature.TimeStamperCertificate.NotAfter)"
