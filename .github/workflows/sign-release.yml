name: Submit Lost Eye signing request

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  submit-signing-request:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    outputs:
      signing-request-id: ${{ steps.submit-signing.outputs['signing-request-id'] }}
      signing-request-web-url: ${{ steps.submit-signing.outputs['signing-request-web-url'] }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build native player
        shell: pwsh
        run: .\scripts\Build-Native.ps1 -OutputName 'Lost-Eye-0.3.4-win-x64-gh'

      - name: Upload unsigned EXE
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Lost Eye.exe
          path: artifacts/Lost-Eye-0.3.4-win-x64-gh/Lost Eye.exe
          archive: false

      - name: Submit signing request
        id: submit-signing
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: false

      - name: Record signing request
        shell: pwsh
        env:
          REQUEST_ID: ${{ steps.submit-signing.outputs['signing-request-id'] }}
          REQUEST_URL: ${{ steps.submit-signing.outputs['signing-request-web-url'] }}
        run: |
          "SignPath request ID: $env:REQUEST_ID" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Approve at: $env:REQUEST_URL" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "Request submitted. After approval, run 'Download and verify signed Lost Eye' with request ID $env:REQUEST_ID."
